<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rubí After Works Bar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #F8EEDC;
            color: #304B68;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .page {
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
        }

        .instagram {
            position: absolute;
            top: -10px;
            right: 0;
            text-decoration: none;
            color: #304B68;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border: 1px solid #304B68;
            padding: 9px 13px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .instagram:hover {
            background: #304B68;
            color: #F8EEDC;
        }

        .logo {
            width: 230px;
            max-width: 65%;
            margin: 70px auto 25px;
            display: block;
        }

        .subtitle {
            font-size: 17px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .line {
            width: 55px;
            height: 2px;
            background: #D71920;
            margin: 18px auto 28px;
        }

        .choose {
            font-size: 15px;
            color: #596B7D;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 18px 20px;
            margin: 14px 0;
            border: 1px solid #304B68;
            border-radius: 8px;
            color: #304B68;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.25);
            transition: all 0.3s ease;
        }

        .button:hover {
            background: #304B68;
            color: white;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #7A8793;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .instagram {
                top: -5px;
                right: 0;
                font-size: 10px;
                padding: 8px 11px;
            }

            .logo {
                width: 210px;
                margin-top: 65px;
            }

            .subtitle {
                font-size: 15px;
            }

            .button {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <a
            class="instagram"
            href="https://www.instagram.com/rubiafterworksbar/"
            target="_blank">
            Instagram · Síguenos
        </a>

        <img
            class="logo"
            src="logo-rubi.png"
            alt="Rubí After Works Bar">

        <div class="subtitle">
            After Works Bar
        </div>

        <div class="line"></div>

        <div class="choose">
            Elige tu idioma · Choose your language
        </div>

        <a class="button" href="menu-es.pdf">
            🇪🇸 &nbsp; ESPAÑOL
        </a>

        <a class="button" href="menu-en.pdf">
            🇺🇸 &nbsp; ENGLISH
        </a>

        <div class="footer">
            RUBÍ AFTER WORKS BAR
        </div>

    </main>

</body>
</html>
